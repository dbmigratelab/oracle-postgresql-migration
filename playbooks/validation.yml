---
- name: Validation apres migration
  hosts: migration_servers
  become: "{{ migration_become | default(true) }}"
  gather_facts: false
  vars_files:
    - ../vars/migration.yml
  tasks:
    - name: Valider les parametres
      ansible.builtin.include_role:
        name: oracle_precheck
        tasks_from: validate.yml
    - name: Verifier que la cible est configuree
      ansible.builtin.assert:
        that: migration_type != 'ASSESSMENT'
    - name: Verifier les dependances
      ansible.builtin.include_role:
        name: ora2pg_install
    - name: Deployer les fichiers
      ansible.builtin.include_role:
        name: ora2pg_migration
        tasks_from: setup.yml
    - name: Controler Oracle
      ansible.builtin.include_role:
        name: oracle_precheck
    - name: Controler PostgreSQL
      ansible.builtin.include_role:
        name: postgresql_precheck
    - name: Produire les rapports de validation
      ansible.builtin.include_role:
        name: migration_validation
